<h3>sp-divider</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-divider</div>
            <p>
                Dividers bring clarity to a layout by grouping and dividing
                content in close proximity.
            </p>

            <div id="variantLabel">Horizontal sizes</div>
            <sp-divider size="s"></sp-divider>
            <p>Small divider</p>
            <sp-divider size="m"></sp-divider>
            <p>Medium divider — subsections, panels, rails</p>
            <sp-divider size="l"></sp-divider>
            <p>Large divider</p>

            <div id="variantLabel">Vertical</div>
            <div style="height: 32px; display: flex; align-items: stretch">
                <sp-action-button quiet label="Zoom in">
                    <sp-icon-magnify slot="icon"></sp-icon-magnify>
                </sp-action-button>
                <sp-divider
                    size="m"
                    style="align-self: stretch; height: auto"
                    vertical
                ></sp-divider>
                <sp-action-button quiet label="Zoom out">
                    <sp-icon-magnify slot="icon"></sp-icon-magnify>
                </sp-action-button>
            </div>
        </div>
        <input type="text" style="width: 2px" />
        <div id="right">
            <div id="subtitle">my-divider</div>
            <p>Extended divider with custom styling.</p>
            <my-divider size="m" class="my-divider"></my-divider>
            <p>Custom medium divider above.</p>
        </div>
    </div>

    <div id="config">
        <div style="display: inline-flex"></div>

        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
