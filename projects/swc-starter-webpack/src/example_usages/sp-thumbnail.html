<h3>sp-thumbnail</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-thumbnail</div>
            <p>
                A thumbnail displays a preview of an image, layer, or effect in
                panels, lists, and pickers.
            </p>

            <div id="variantLabel">Sizes</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="100">
                    <img
                        src="https://picsum.photos/200/200"
                        alt="Size 100 preview"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="200">
                    <img
                        src="https://picsum.photos/300/300"
                        alt="Size 200 preview"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="500">
                    <img
                        src="https://picsum.photos/400/400"
                        alt="Size 500 preview"
                    />
                </sp-thumbnail>
            </div>

            <div id="variantLabel">Non-square content (letterboxing)</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="300">
                    <img
                        src="https://picsum.photos/300/400"
                        alt="Portrait preview"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="300">
                    <img
                        src="https://picsum.photos/500/100"
                        alt="Wide preview"
                    />
                </sp-thumbnail>
            </div>

            <div id="variantLabel">Cover</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="300" cover>
                    <img
                        src="https://picsum.photos/300/400"
                        alt="Portrait cover preview"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="300" cover>
                    <img
                        src="https://picsum.photos/500/100"
                        alt="Wide cover preview"
                    />
                </sp-thumbnail>
            </div>

            <div id="variantLabel">Custom background</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="300" background="red">
                    <img
                        src="https://picsum.photos/300/400"
                        alt="Portrait on red background"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="300" background="#00ff00">
                    <img
                        src="https://picsum.photos/500/100"
                        alt="Wide preview on green background"
                    />
                </sp-thumbnail>
            </div>

            <div id="variantLabel">Layer</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="300" layer>
                    <img
                        src="https://picsum.photos/400/400"
                        alt="Layer thumbnail"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="300" layer selected>
                    <img
                        src="https://picsum.photos/500/100"
                        alt="Selected layer thumbnail"
                    />
                </sp-thumbnail>
            </div>

            <div id="variantLabel">States</div>
            <div class="demo-example demo-flex-row">
                <sp-thumbnail size="200" focused>
                    <img
                        src="https://picsum.photos/200/200"
                        alt="Focused thumbnail"
                    />
                </sp-thumbnail>
                <sp-thumbnail size="200" disabled>
                    <img
                        src="https://picsum.photos/200/200"
                        alt="Disabled thumbnail"
                    />
                </sp-thumbnail>
            </div>
        </div>
        <input type="text" style="width: 2px" />
        <div id="right">
            <div id="subtitle">my-thumbnail</div>
            <p>Extended thumbnail with square corners at size 300.</p>
            <my-thumbnail class="my-thumbnail" size="300">
                <img
                    src="https://picsum.photos/350/350"
                    alt="Custom thumbnail preview"
                />
            </my-thumbnail>
        </div>
    </div>

    <div id="config">
        <div style="display: inline-flex"></div>

        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
