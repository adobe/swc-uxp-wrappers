<h3>sp-progress-bar</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-progress-bar</div>

            <!-- Sizes -->
            <div style="margin: 16px 20px 4px; font-weight: bold; font-size: 12px; color: #6e6e6e;">SIZES</div>

            <div style="margin: 8px 20px; display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <sp-progress-bar label="Small" progress="65" size="s" style="width: 240px"></sp-progress-bar>
                </div>
                <div>
                    <sp-progress-bar label="Medium" progress="65" size="m" style="width: 240px"></sp-progress-bar>
                </div>
                <div>
                    <sp-progress-bar label="Large" progress="65" size="l" style="width: 240px"></sp-progress-bar>
                </div>
                <div>
                    <sp-progress-bar label="Extra Large" progress="65" size="xl" style="width: 240px"></sp-progress-bar>
                </div>
            </div>

            <!-- Variants -->
            <div style="margin: 20px 20px 4px; font-weight: bold; font-size: 12px; color: #6e6e6e;">VARIANTS</div>

            <div style="margin: 8px 20px; display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 4px;">Indeterminate</div>
                    <sp-progress-bar label="Loading" indeterminate style="width: 240px"></sp-progress-bar>
                </div>
                <div>
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 4px;">Side label</div>
                    <sp-progress-bar label="Uploading" progress="42" side-label style="width: 240px"></sp-progress-bar>
                </div>
                <div>
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 4px;">Static white</div>
                    <div style="background-color: #1473e6; padding: 12px 16px; display: inline-block; border-radius: 4px;">
                        <sp-progress-bar label="Saving" progress="55" static-color="white" style="width: 200px"></sp-progress-bar>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
