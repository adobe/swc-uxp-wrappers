<h3>sp-meter</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-meter</div>

            <h4 class="spectrum-Heading--subtitle1">Default</h4>
            <div style="margin-bottom: 16px;">
                <sp-meter size="m" progress="71" style="width: 240px;">
                    Tasks Completed
                </sp-meter>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Variants</h4>
            <div style="display: flex; flex-direction: column; margin-bottom: 16px;">
                <sp-meter progress="40" style="width: 240px;">
                    Default (no variant)
                </sp-meter>
                <sp-meter variant="positive" progress="80" style="width: 240px; margin-top: 12px;">
                    Positive
                </sp-meter>
                <sp-meter variant="notice" progress="55" style="width: 240px; margin-top: 12px;">
                    Notice
                </sp-meter>
                <sp-meter variant="negative" progress="20" style="width: 240px; margin-top: 12px;">
                    Negative
                </sp-meter>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Sizes</h4>
            <div style="display: flex; flex-direction: column; margin-bottom: 16px;">
                <sp-meter size="s" progress="60" style="width: 240px;">Small</sp-meter>
                <sp-meter size="m" progress="60" style="width: 240px; margin-top: 12px;">Medium</sp-meter>
                <sp-meter size="l" progress="60" style="width: 240px; margin-top: 12px;">Large</sp-meter>
                <sp-meter size="xl" progress="60" style="width: 240px; margin-top: 12px;">Extra Large</sp-meter>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Side Label</h4>
            <div style="margin-bottom: 16px;">
                <sp-meter side-label progress="45" style="width: 240px;">Side Label</sp-meter>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Side Label with Variant</h4>
            <div style="margin-bottom: 16px;">
                <sp-meter side-label variant="positive" progress="75" style="width: 240px;">
                    Positive
                </sp-meter>
            </div>
        </div>
        <input type="text" style="width: 2px" />
        <div id="right">
            <div id="subtitle">my-meter</div>
            <div style="margin: 20px 20px">
                <my-meter size="m" progress="71" style="width: 200px">
                    Tasks Completed
                </my-meter>
            </div>
        </div>
    </div>

    <div id="config">
        <div style="display: inline-flex"></div>
        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
