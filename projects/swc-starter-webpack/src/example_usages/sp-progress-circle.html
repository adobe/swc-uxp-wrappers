<h3>sp-progress-circle</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-progress-circle</div>

            <!-- Sizes -->
            <div style="margin: 16px 20px 4px; font-weight: bold; font-size: 12px; color: #6e6e6e;">SIZES</div>

            <div style="margin: 8px 20px; display: flex; flex-direction: row; align-items: center;">
                <div style="display: flex; flex-direction: column; align-items: center; margin-right: 24px;">
                    <sp-progress-circle label="Small" progress="65" size="s"></sp-progress-circle>
                    <div style="font-size: 11px; color: #6e6e6e; margin-top: 6px;">Small</div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; margin-right: 24px;">
                    <sp-progress-circle label="Medium" progress="65" size="m"></sp-progress-circle>
                    <div style="font-size: 11px; color: #6e6e6e; margin-top: 6px;">Medium</div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <sp-progress-circle label="Large" progress="65" size="l"></sp-progress-circle>
                    <div style="font-size: 11px; color: #6e6e6e; margin-top: 6px;">Large</div>
                </div>
            </div>

            <!-- Variants -->
            <div style="margin: 20px 20px 4px; font-weight: bold; font-size: 12px; color: #6e6e6e;">VARIANTS</div>

            <div style="margin: 8px 20px;">
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 8px;">Indeterminate (attribute — deprecated in S2)</div>
                    <sp-progress-circle label="Loading" indeterminate></sp-progress-circle>
                </div>
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 8px;">Indeterminate (progress=null — Spectrum 2 preferred)</div>
                    <sp-progress-circle id="indeterminate-s2" label="Loading"></sp-progress-circle>
                </div>
                <div>
                    <div style="font-size: 11px; color: #6e6e6e; margin-bottom: 8px;">Static white</div>
                    <div style="background-color: #1473e6; padding: 16px; display: inline-block; border-radius: 4px;">
                        <sp-progress-circle label="Saving" progress="55" static-color="white"></sp-progress-circle>
                    </div>
                </div>
            </div>

            <!-- Progress control -->
            <div style="margin: 20px 20px 4px; font-weight: bold; font-size: 12px; color: #6e6e6e;">INTERACTIVE</div>

            <div style="margin: 8px 20px;">
                <sp-progress-circle id="interactive-circle" label="Progress" progress="0" size="l" style="margin-bottom: 12px;"></sp-progress-circle>
                <div style="display: flex; align-items: center;">
                    <input
                        id="progress-slider"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        style="width: 200px"
                    />
                    <span id="progress-value" style="font-size: 12px; color: #6e6e6e; min-width: 30px; margin-left: 12px;">0%</span>
                </div>
            </div>

        </div>
    </div>
</div>
